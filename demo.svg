<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="720" height="432" rx="10" fill="#0d1117"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#27c93f"/>
  <text x="360" y="26" text-anchor="middle" font-size="12" fill="#6e7681">sanitycheck</text>

  <g>
    <!-- git clone hook -> DANGEROUS (ChocoPoC) -->
    <text x="18" y="60" xml:space="preserve"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> git clone https://github.com/redteam/CVE-2026-31337-poc.git</tspan></text>
    <text x="18" y="80" xml:space="preserve"><tspan fill="#8b949e">sanitycheck: scanning freshly cloned 'CVE-2026-31337-poc'...</tspan></text>
    <text x="18" y="100" xml:space="preserve"><tspan fill="#f85149">  [!]</tspan><tspan fill="#39c5cf"> import-shadow</tspan><tspan fill="#c9d1d9">   gradient.so shadows gradient.py on import</tspan></text>
    <text x="18" y="120" xml:space="preserve"><tspan fill="#f85149">  [!]</tspan><tspan fill="#39c5cf"> ioc-pkg</tspan><tspan fill="#c9d1d9">         depends on known-malicious 'skytext'</tspan></text>
    <text x="18" y="140" xml:space="preserve"><tspan fill="#f85149" font-weight="bold">  [!] VERDICT: DANGEROUS</tspan></text>

    <!-- pip install hook -> CAUTION (typosquat), prompts -->
    <text x="18" y="176" xml:space="preserve"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> pip install -r requirements.txt</tspan></text>
    <text x="18" y="196" xml:space="preserve"><tspan fill="#8b949e">sanitycheck: scanning '.' before pip install...</tspan></text>
    <text x="18" y="216" xml:space="preserve"><tspan fill="#d29922">  [~]</tspan><tspan fill="#39c5cf"> typosquat</tspan><tspan fill="#c9d1d9">       'reqests' is one edit from 'requests'</tspan></text>
    <text x="18" y="236" xml:space="preserve"><tspan fill="#d29922" font-weight="bold">  [~] VERDICT: CAUTION</tspan><tspan fill="#8b949e">   install anyway? [y/N]</tspan></text>

    <!-- curl | bash -> DANGEROUS (staged second stage) -->
    <text x="18" y="272" xml:space="preserve"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> curl -fsSL https://get.tool.dev/install.sh | bash</tspan></text>
    <text x="18" y="292" xml:space="preserve"><tspan fill="#8b949e">sanitycheck: audit this before running? [Y/n]</tspan></text>
    <text x="18" y="312" xml:space="preserve"><tspan fill="#f85149">  [!]</tspan><tspan fill="#39c5cf"> download-exec</tspan><tspan fill="#c9d1d9">   fetches + runs a staged second-stage script</tspan></text>
    <text x="18" y="332" xml:space="preserve"><tspan fill="#f85149" font-weight="bold">  [!] VERDICT: DANGEROUS</tspan></text>

    <!-- direct usage -> SAFE -->
    <text x="18" y="368" xml:space="preserve"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> sanitycheck ./exploit.py</tspan></text>
    <text x="18" y="388" xml:space="preserve"><tspan fill="#3fb950" font-weight="bold">  [+] VERDICT: SAFE</tspan><tspan fill="#8b949e">   nothing suspicious found by static checks</tspan></text>
  </g>
</svg>
